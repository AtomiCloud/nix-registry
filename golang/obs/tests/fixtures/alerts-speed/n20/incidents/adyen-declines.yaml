story: Adyen declines a burst of cards for 20 minutes.
window: { start: 60m, duration: 20m }
change:
  - { metric: checkout.charges, where: { payment.provider: adyen, outcome: declined }, rate: 0.8/s }
expect:
  fire: [declines/adyen-metric, declines/adyen-logs]
  quiet: [charge-errors/critical, charge-errors/ratio, latency/p95-warning, traffic/low]
  fire_within: 15m
  resolve_within: 20m
