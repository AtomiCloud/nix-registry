namespace: durian.cloud/shop/billing
premise: Money owed by a customer, from the first charge to the last receipt
language:
  Invoice:
    desc: The bill sent to a customer for a period.
    details: |
      An invoice lists every Charge of the period.

      It is final once sent.
    avoid: [bill, statement]
    see: [Charge, durian.cloud/engineering/standards/OOP#OCP]
  Charge:
    desc: One amount added to an invoice.
    see: [Invoice]
  Plugin:
    desc: A payment method that the billing context can take money with.
    aliases: [Payment Plugin]
