story: The charge route gets 6x slower for 40 minutes.
window: { start: 150m, duration: 40m }
change:
  - { metric: http.server.request.duration, where: { http.route: /charge }, latency_x: 6 }
expect:
  fire:
    [
      traces-latency-p95,
      traces-latency-p50,
      traces-latency-p99,
      traces-latency-avg,
      traces-latency-max,
      traces-latency-sum,
      traces-latency-range,
    ]
  quiet:
    [
      traces-errors-rate,
      traces-errors-by-provider,
      traces-errors-count,
      traces-errors-ratio,
      traces-errors-range,
      traces-client-errors,
      traces-errors-structural,
      traces-errors-by-service,
      traces-declines-adyen,
      traces-declines-by-provider,
      traces-traffic-low,
      traces-refund-errors,
      traces-slow-provider-calls,
    ]
  fire_within: 30m
  resolve_within: 20m
