# Stress contract for the dotnet and dart generators: long names (line wrapping), reserved words,
# values that start with a digit, quotes and a dollar sign, a label named like a keyword, a service
# with a dash, a metric with no labels. Not a realistic service.
service: pay-ments
interval: 30s

types:
  region: { kind: enum, values: [us-east-1, default, class, 1xx, "it's", 'a$b', Wire, All, region] }
  very_long_bounded_number_type_name_for_wrapping: { kind: int, min: -5, max: 99 }
  hour: { kind: time, unit: hour_of_day }
  very_long_calendar_date_type_name_to_wrap_the_line: { kind: date, window_days: 365 }
  note: { kind: free }

metrics:
  payments.provider.settlement.batch.reconciliation.duration:
    kind: histogram
    unit: seconds
    budget: 3000000
    labels:
      region: region
      default: region
      very_long_bounded_number_type_name_for_wrapping: very_long_bounded_number_type_name_for_wrapping
      k8s.zone: hour
  payments.provider.settlement.batch.reconciliation.late:
    kind: counter
    budget: 9000000
    labels:
      {
        very_long_calendar_date_type_name_to_wrap_the_line: very_long_calendar_date_type_name_to_wrap_the_line,
        hour: hour,
      }
  payments.idle:
    kind: gauge
    across_pods: last

logs:
  Class: { event: payments.class.started, level: fatal }
  New: { event: payments.new, level: trace }
  VeryLongEventKeyNameThatNeedsWrappingInTheGeneratedCode:
    { event: payments.provider.settlement.batch.reconciliation.failed, level: error }

spans:
  payments.provider.settlement.batch.reconciliation:
    kind: server
    attributes: { note: note, default: region, hour: hour }

generate:
  - { lang: dotnet, out: gen/dotnet/Signals, namespace: Pay.Signals }
  - { lang: dart, out: gen/dart/lib/src/signals, package: pay_signals }
