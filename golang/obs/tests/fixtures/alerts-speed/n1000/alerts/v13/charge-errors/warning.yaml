apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v13-charge-errors-warning
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v13-charge-errors-warning
      title: 'Charge errors elevated'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 180, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'sum(rate(checkout_charges_total{outcome="error"}[3m]))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.55' }
      labels: { severity: warning }
      annotations: { summary: 'Charge errors elevated' }
