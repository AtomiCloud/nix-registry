apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v6-logs-error-rate
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v6-logs-error-rate
      title: 'Error log rate'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 420, to: 0 }
          datasourceUid: speed-logs
          model:
            datasource: { type: victoriametrics-logs-datasource, uid: speed-logs }
            expr: '_time:7m {durian.cloud.service="checkout"} "durian.cloud/event":="checkout.charge.failed" severity_text:="ERROR" | stats rate() per_s'
            queryType: stats
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.5' }
      labels: { severity: warning }
      annotations: { summary: 'Error log rate' }
