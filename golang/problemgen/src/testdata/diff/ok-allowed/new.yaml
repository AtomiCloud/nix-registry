apiVersion: problems.atomi.cloud/v1
kind: ProblemSet
module: m
version: v1
types:
  Level: { enum: [a, b] }
  Box:
    fields:
      w: { type: integer }
problems:
  p:
    title: P
    status: 429
    recoverable: true
    retryAfter: wait
    detail: "please wait {wait}s"
    log: "{secret}"
    deprecated: "use q"
    data:
      wait: { type: integer }
      name: { type: string }
      level: { type: Level }
      box: { type: Box }
      added: { type: string, optional: true }
      secret: { type: string, private: true }
  q: { title: Q, status: 400, recoverable: true, detail: d }
