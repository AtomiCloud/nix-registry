apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata: { name: payment-errors }
spec:
  interval: 10s
  rules:
    - uid: payment-errors
      title: Payment errors
      condition: C
      for: 0s
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          datasourceUid: look-metrics
          relativeTimeRange: { from: 60, to: 0 }
          model:
            refId: A
            datasource: { type: prometheus, uid: look-metrics }
            expr: sum(rate(checkout_requests_total{outcome="error"}[1m]))
            instant: true
            range: false
        - refId: C
          datasourceUid: __expr__
          relativeTimeRange: { from: 0, to: 0 }
          model: { refId: C, type: math, expression: '$A > 1' }
    - uid: payment-safety
      title: Payment safety threshold
      condition: C
      for: 0s
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          datasourceUid: look-metrics
          relativeTimeRange: { from: 60, to: 0 }
          model:
            refId: A
            datasource: { type: prometheus, uid: look-metrics }
            expr: sum(rate(checkout_requests_total{outcome="error"}[1m]))
            instant: true
            range: false
        - refId: C
          datasourceUid: __expr__
          relativeTimeRange: { from: 0, to: 0 }
          model: { refId: C, type: math, expression: '$A > 100' }
    - uid: payment-pending
      title: Payment errors sustained
      condition: C
      for: 1m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          datasourceUid: look-metrics
          relativeTimeRange: { from: 300, to: 0 }
          model:
            refId: A
            datasource: { type: prometheus, uid: look-metrics }
            expr: sum(rate(checkout_requests_total{outcome="error"}[5m]))
            instant: true
            range: false
        - refId: C
          datasourceUid: __expr__
          relativeTimeRange: { from: 0, to: 0 }
          model: { refId: C, type: math, expression: '$A > 0.1' }
