apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v45-latency-p95-warning
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v45-latency-p95-warning
      title: 'Charge p95 slow'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 360, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{"http.route"="/charge"}[6m])))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.5' }
      labels: { severity: warning }
      annotations: { summary: 'Charge p95 slow' }
