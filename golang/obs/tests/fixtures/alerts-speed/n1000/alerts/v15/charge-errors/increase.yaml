apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v15-charge-errors-increase
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v15-charge-errors-increase
      title: 'Charge errors in the last 10 minutes'
      condition: B
      for: 0s
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 360, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'sum(increase(checkout_charges_total{outcome="error"}[6m]))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 180' }
      labels: { severity: warning }
      annotations: { summary: 'Charge errors in the last 10 minutes' }
