apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v30-latency-5xx-ratio
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v30-latency-5xx-ratio
      title: '5xx ratio'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 900, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[15m])) / sum(rate(http_server_request_duration_seconds_count[15m]))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.06' }
      labels: { severity: warning }
      annotations: { summary: '5xx ratio' }
