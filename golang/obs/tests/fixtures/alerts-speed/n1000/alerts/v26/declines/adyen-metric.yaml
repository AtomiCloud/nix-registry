apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v26-declines-adyen-metric
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v26-declines-adyen-metric
      title: 'Adyen declines (metric)'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 420, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'sum(rate(checkout_charges_total{payment_provider="adyen", outcome="declined"}[7m]))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.5' }
      labels: { severity: warning }
      annotations: { summary: 'Adyen declines (metric)' }
