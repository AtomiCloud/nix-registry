apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v32-latency-p95-critical
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v32-latency-p95-critical
      title: 'Charge p95 very slow'
      condition: B
      for: 10m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 120, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{http_route="/charge"}[2m])))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.8' }
      labels: { severity: critical }
      annotations: { summary: 'Charge p95 very slow' }
