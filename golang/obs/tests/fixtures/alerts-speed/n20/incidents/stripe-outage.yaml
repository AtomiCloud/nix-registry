story: Stripe returns 502 for 40% of charges for 30 minutes.
window: { start: 90m, duration: 30m }
change:
  - { metric: checkout.charges, where: { payment.provider: stripe, outcome: error }, rate: 1.2/s }
expect:
  fire: [charge-errors/critical]
  quiet: []
  fire_within: 20m
  resolve_within: 20m
