apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v23-logs-failed-by-provider
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v23-logs-failed-by-provider
      title: 'Failed charge log lines by provider'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 180, to: 0 }
          datasourceUid: speed-logs
          model:
            datasource: { type: victoriametrics-logs-datasource, uid: speed-logs }
            expr: '_time:3m {durian.cloud.service="checkout"} "durian.cloud/event":="checkout.charge.failed" | stats by (payment.provider) count() hits'
            queryType: stats
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 72' }
      labels: { severity: warning }
      annotations: { summary: 'Failed charge log lines by provider' }
