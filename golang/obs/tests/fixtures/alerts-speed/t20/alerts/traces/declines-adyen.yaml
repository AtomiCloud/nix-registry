apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-traces-declines-adyen
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: traces-declines-adyen
      title: 'Adyen declines'
      condition: E
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          queryType: traceql
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: speed-traces
          model:
            datasource: { type: tempo, uid: speed-traces }
            queryType: traceql
            metricsQueryType: instant
            query: '{ span.payment.provider = "adyen" && span.outcome = "declined" } | rate()'
        - refId: B
          datasourceUid: __expr__
          model: { type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
        - refId: E
          datasourceUid: __expr__
          model: { type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.5] } }] }
      labels: { severity: warning }
      annotations: { summary: 'Adyen declines' }
