apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: externalsecrets.external-secrets.io
spec:
  group: external-secrets.io
  names: { kind: ExternalSecret, listKind: ExternalSecretList, plural: externalsecrets, singular: externalsecret }
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [secretStoreRef]
              properties:
                refreshInterval: { type: string }
                secretStoreRef:
                  type: object
                  properties:
                    name: { type: string }
                    kind: { type: string }
                target:
                  type: object
                  properties:
                    name: { type: string }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      secretKey: { type: string }
                      remoteRef:
                        type: object
                        properties:
                          key: { type: string }
