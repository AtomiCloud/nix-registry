apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v44-declines-adyen-logs
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v44-declines-adyen-logs
      title: 'Adyen declines (logs)'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 240, to: 0 }
          datasourceUid: speed-logs
          model:
            datasource: { type: victoriametrics-logs-datasource, uid: speed-logs }
            expr: '_time:4m {durian.cloud.service="checkout"} "durian.cloud/event":="checkout.charge.declined" "payment.provider":="adyen" | stats count() hits'
            queryType: stats
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 210' }
      labels: { severity: warning }
      annotations: { summary: 'Adyen declines (logs)' }
