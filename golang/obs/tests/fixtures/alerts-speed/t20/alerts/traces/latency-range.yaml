apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-traces-latency-range
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: traces-latency-range
      title: 'Charge p95 slow (range)'
      condition: E
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          queryType: traceql
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: speed-traces
          model:
            datasource: { type: tempo, uid: speed-traces }
            queryType: traceql
            metricsQueryType: range
            step: 1m
            query: '{ span.http.route = "/charge" && span.http.response.status_code = 200 } | quantile_over_time(duration, .95) with (exemplars=false)'
        - refId: B
          datasourceUid: __expr__
          model: { type: reduce, expression: A, reducer: mean, settings: { mode: dropNN } }
        - refId: E
          datasourceUid: __expr__
          model: { type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.5] } }] }
      labels: { severity: warning }
      annotations: { summary: 'Charge p95 slow (range)' }
