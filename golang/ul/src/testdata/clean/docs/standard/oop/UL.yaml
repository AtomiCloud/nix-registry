namespace: durian.cloud/engineering/standards/OOP
premise: When writing code, best practice when using object-oriented programming
language:
  OCP:
    aliases: [Open-Close Principle, Plugin Design]
    desc: Add behaviour by adding a plugin, not by editing shared code.
    details: |
      Code is **open** for extension and **closed** for edits.

      Add a plugin that implements the seam; never rewrite another plugin's line.
    avoid: [extension point]
    see: [Plugin, SRP]
  Plugin:
    desc: One part added to the core through one seam.
    details: |
      A plugin owns its own types and joins the core with one registration line.
    see: [OCP]
  SRP:
    aliases: [Single Responsibility]
    desc: A module has one reason to change.
    details: Pairs with the Open-Close Principle when a plugin grows.
  Facade:
    desc: Old name for the one entry object of a plugin.
    status: retired
    replacedBy: Plugin
