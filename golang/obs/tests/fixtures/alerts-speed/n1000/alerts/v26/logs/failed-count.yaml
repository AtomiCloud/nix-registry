apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v26-logs-failed-count
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v26-logs-failed-count
      title: 'Failed charge log lines'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 420, to: 0 }
          datasourceUid: speed-logs
          model:
            datasource: { type: victoriametrics-logs-datasource, uid: speed-logs }
            expr: '_time:7m {durian.cloud.service="checkout"} "durian.cloud/event":="checkout.charge.failed" | stats count() hits'
            queryType: stats
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 168' }
      labels: { severity: warning }
      annotations: { summary: 'Failed charge log lines' }
