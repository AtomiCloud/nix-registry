apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-traces-errors-ratio
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: traces-errors-ratio
      title: 'Error span ratio'
      condition: E
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          queryType: traceql
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: speed-traces
          model:
            datasource: { type: tempo, uid: speed-traces }
            queryType: traceql
            metricsQueryType: instant
            query: '{ status = error } | rate()'
        - refId: B
          datasourceUid: __expr__
          model: { type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
        - refId: C
          queryType: traceql
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: speed-traces
          model:
            datasource: { type: tempo, uid: speed-traces }
            queryType: traceql
            metricsQueryType: instant
            query: '{ kind = server } | rate()'
        - refId: D
          datasourceUid: __expr__
          model: { type: reduce, expression: C, reducer: last, settings: { mode: dropNN } }
        - refId: E
          datasourceUid: __expr__
          model: { type: math, expression: '$B / $D > 0.1' }
      labels: { severity: warning }
      annotations: { summary: 'Error span ratio' }
