apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-latency-avg
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: latency-avg
      title: 'Average request time high'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'sum(rate(http_server_request_duration_seconds_sum[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.3' }
      labels: { severity: warning }
      annotations: { summary: 'Average request time high' }
