apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - { name: web, image: 'nginx:latest' }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: web, namespace: demo }
spec:
  parentRefs: [{ name: gw }]
  rules:
    - backendRefs: [{ name: web, port: 80 }]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: web, namespace: demo }
spec:
  secretStoreRef: { name: store, kind: ClusterSecretStore }
  target: { name: web }
  data:
    - secretKey: token
      remoteRef: { key: web/token }
---
apiVersion: cloud.example.io/v1
kind: LogtoApp
metadata: { name: web, namespace: demo }
spec:
  identityRef: { platform: acme, landscape: lapras }
  paths: ['/web']
  extraRedirectUris: []
  resourceRefs: []
