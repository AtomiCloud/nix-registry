apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: payments-checkout-charges-warning
spec:
  folderRef: payments-checkout-folder
  interval: 1m
  rules:
    - uid: charges-warning
      title: charges warning
      condition: A
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: fixture-metrics
          model:
            expr: 'sum(rate(checkout_charges_total{outcome="error"})) > 0.01'
            instant: true

      labels: { severity: warning }
      annotations: { summary: 'charges warning' }
