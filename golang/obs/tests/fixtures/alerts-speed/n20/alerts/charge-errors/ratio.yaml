apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-charge-errors-ratio
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: charge-errors-ratio
      title: 'Charge error ratio'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: speed-metrics
          model:
            datasource: { type: prometheus, uid: speed-metrics }
            expr: 'sum(rate(checkout_charges_total{outcome="error"}[5m])) / sum(rate(checkout_charges_total[5m]))'
            instant: true
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 0.1' }
      labels: { severity: warning }
      annotations: { summary: 'Charge error ratio' }
