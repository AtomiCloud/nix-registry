apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-v28-logs-slow-unwrap
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: v28-logs-slow-unwrap
      title: 'Warn log lines high (replaces logged duration)'
      condition: B
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: speed-logs
          model:
            datasource: { type: victoriametrics-logs-datasource, uid: speed-logs }
            expr: '_time:10m {durian.cloud.service="checkout"} "durian.cloud/event":="checkout.charge.declined" severity_text:="WARN" | stats count() hits'
            queryType: stats
        - refId: B
          datasourceUid: __expr__
          model: { type: math, expression: '$A > 120' }
      labels: { severity: warning }
      annotations: { summary: 'Warn log lines high (replaces logged duration)' }
