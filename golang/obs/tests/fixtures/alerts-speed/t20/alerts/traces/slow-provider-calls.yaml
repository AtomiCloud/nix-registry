apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: speed-checkout-traces-slow-provider-calls
spec:
  folderRef: speed-checkout-folder
  interval: 1m
  rules:
    - uid: traces-slow-provider-calls
      title: 'Slow provider calls (range, default step)'
      condition: E
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          queryType: traceql
          relativeTimeRange: { from: 300, to: 0 }
          datasourceUid: speed-traces
          model:
            datasource: { type: tempo, uid: speed-traces }
            queryType: traceql
            metricsQueryType: range
            query: '{ kind = client } | quantile_over_time(duration, .9) with (exemplars=false)'
        - refId: B
          datasourceUid: __expr__
          model: { type: reduce, expression: A, reducer: max, settings: { mode: dropNN } }
        - refId: E
          datasourceUid: __expr__
          model: { type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [2] } }] }
      labels: { severity: warning }
      annotations: { summary: 'Slow provider calls (range, default step)' }
