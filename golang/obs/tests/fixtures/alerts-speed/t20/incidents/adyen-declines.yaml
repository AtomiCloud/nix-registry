story: Adyen declines a burst of cards for 20 minutes.
window: { start: 60m, duration: 20m }
change:
  - { metric: checkout.charges, where: { payment.provider: adyen, outcome: declined }, rate: 0.8/s }
expect:
  fire: [traces-declines-adyen, traces-declines-by-provider]
  quiet:
    [
      traces-errors-rate,
      traces-errors-by-provider,
      traces-errors-count,
      traces-errors-ratio,
      traces-errors-range,
      traces-client-errors,
      traces-errors-structural,
      traces-errors-by-service,
      traces-latency-p95,
      traces-latency-p50,
      traces-latency-p99,
      traces-latency-avg,
      traces-latency-max,
      traces-latency-sum,
      traces-latency-range,
      traces-traffic-low,
      traces-refund-errors,
      traces-slow-provider-calls,
    ]
  fire_within: 30m
  resolve_within: 20m
