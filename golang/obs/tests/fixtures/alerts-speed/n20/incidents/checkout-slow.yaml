story: The charge route gets 6x slower for 40 minutes.
window: { start: 150m, duration: 40m }
change:
  - { metric: http.server.request.duration, where: { http.route: /charge }, latency_x: 6 }
expect:
  fire: [latency-p95-critical, latency-p95-warning, latency-avg, mixed-errors-or-latency]
  quiet:
    [
      charge-errors-critical,
      charge-errors-warning,
      charge-errors-ratio,
      charge-errors-increase,
      charge-errors-by-provider,
      charge-errors-no-window,
      latency-5xx-ratio,
      traffic-low,
      metricsql-with-template,
      declines-adyen-metric,
      declines-adyen-logs,
      logs-failed-count,
      logs-failed-json,
      logs-failed-by-provider,
      logs-error-rate,
      logs-slow-unwrap,
    ]
  fire_within: 30m
  resolve_within: 20m
