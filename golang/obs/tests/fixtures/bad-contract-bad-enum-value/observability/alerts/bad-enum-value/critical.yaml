apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: payments-checkout-charge-errors-critical
spec:
  folderRef: payments-checkout-folder
  interval: 1m
  rules:
    - uid: charge-errors-critical
      title: 🚨 Charge errors high
      condition: A
      for: 5m
      noDataState: OK
      execErrState: Error
      data:
        - refId: A
          relativeTimeRange: { from: 600, to: 0 }
          datasourceUid: fixture-metrics
          model:
            expr: 'sum(rate(checkout_charges_total{outcome="refunded"}[5m])) > 0.01'
            instant: true
      labels: { severity: critical }
      annotations: { summary: '🚨 Charge errors high' }
