name: CI-CD

on:
  push:

jobs:
  precommit:
    name: Pre-Commit
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-nix-registry-nix-store-cache
      - nscloud-git-mirror-1gb
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
      # pre commit
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh

  # TEMPORARY POSTURE — the release gate is linux-only.
  #
  # `build` (linux) and `build-macos` are the same build, split into two jobs
  # ONLY so that `release` can depend on the linux legs without also waiting on
  # macOS. The Namespace macOS runner pool has been sitting QUEUED for hours at
  # a time, and because `needs` waits for the WHOLE matrix job, a single queued
  # macOS leg was holding every release the downstream cascade depends on.
  #
  # macOS is informational until the runner pool stabilizes; linux is the
  # release gate — the box and the CI consumers are linux. It is deliberately
  # NOT `continue-on-error`: a real macOS break still shows red on the commit,
  # it just no longer blocks the release.
  #
  # To revert once the pool is healthy: fold the `build-macos` runner back in as
  # a third `platform` entry and delete `build-macos` and this comment.
  build:
    name: Nix Build
    strategy:
      # Per-arch caches are independent, so one arch failing/cold-building
      # should not cancel the others.
      fail-fast: false
      matrix:
        # Each architecture gets its OWN cache tag. amd64 and arm64 previously
        # shared one tag (nix-registry-nix-build-store-cache); since both jobs
        # mount and persist the same Namespace volume concurrently, the slower
        # job's store would overwrite the faster one's, so the two arches kept
        # clobbering each other's cache (one warm, the other cold every run).
        #
        # Linux runners are 8x16 (16GB): on a cold cache the heavy rust
        # workspaces (worktrunk, attic) are built from source, and a
        # single one needs more than the old 4x8 (8GB) runner had.
        platform:
          - name: Linux x86_64
            os:
              - nscloud-ubuntu-22.04-amd64-8x16-with-cache
              - nscloud-cache-size-50gb
              - nscloud-cache-tag-nix-registry-nix-build-store-cache-amd64
              - nscloud-git-mirror-1gb
          - name: Linux aarch64
            os:
              - nscloud-ubuntu-22.04-arm64-8x16-with-cache
              - nscloud-cache-size-50gb
              - nscloud-cache-tag-nix-registry-nix-build-store-cache-arm64
              - nscloud-git-mirror-1gb
    runs-on: ${{ matrix.platform.os }}
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3

      - name: Nix Build
        run: ./scripts/ci/nix-build.sh

  # Informational leg — same build as `build`, deliberately absent from
  # `release.needs`. See the TEMPORARY POSTURE comment above.
  build-macos:
    name: Nix Build (MacOS aarch64)
    runs-on:
      - nscloud-macos-sequoia-arm64-6x14-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-nix-registry-nix-build-store-cache-macos-arm64
      - nscloud-git-mirror-1gb
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3

      - name: Nix Build
        run: ./scripts/ci/nix-build.sh

  release:
    name: Semantic Release
    # `build-macos` is intentionally NOT listed here — see the TEMPORARY
    # POSTURE comment above the `build` job.
    needs:
      - precommit
      - build
    if: github.ref == 'refs/heads/main'
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-nix-registry-releaser-nix-store-cache
      - nscloud-git-mirror-1gb
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          auth-bot-app-id: ${{ vars.AUTH_BOT_APP_ID }}
          auth-bot-secret-key: ${{ secrets.AUTH_BOT_SECRET_KEY }}
      - uses: AtomiCloud/actions.cache-npm@v1

      # action
      - name: Release
        env:
          # needed for releaser
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop .#releaser -c scripts/ci/release.sh
