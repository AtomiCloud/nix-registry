name: CI-CD

on:
  push:

jobs:
  precommit:
    name: Pre-Commit
    runs-on: ubuntu-24.04
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
      # pre commit
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh

  # TEMPORARY POSTURE — the release gate is linux-only.
  #
  # `build` (linux) and `build-macos` are the same build, split into two jobs
  # ONLY so that `release` can depend on the linux legs without also waiting on
  # macOS. `needs` waits for the WHOLE matrix job, so a single slow or queued
  # macOS leg would hold every release the downstream cascade depends on.
  #
  # macOS is informational; linux is the release gate — the box and the CI
  # consumers are linux. It is deliberately NOT `continue-on-error`: a real
  # macOS break still shows red on the commit, it just no longer blocks the
  # release.
  #
  # To revert: fold the `build-macos` runner back in as a third `platform`
  # entry and delete `build-macos` and this comment.
  build:
    name: Nix Build
    strategy:
      # One arch failing/cold-building should not cancel the other.
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.os }}
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'

      - name: Nix Build
        run: ./scripts/ci/nix-build.sh

  # Informational leg — same build as `build`, deliberately absent from
  # `release.needs`. See the TEMPORARY POSTURE comment above.
  build-macos:
    name: Nix Build (MacOS aarch64)
    runs-on: macos-latest
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'

      - name: Nix Build
        run: ./scripts/ci/nix-build.sh

  release:
    name: Semantic Release
    # `build-macos` is intentionally NOT listed here — see the TEMPORARY
    # POSTURE comment above the `build` job.
    needs:
      - precommit
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
          auth-bot-app-id: ${{ vars.AUTH_BOT_APP_ID }}
          auth-bot-secret-key: ${{ secrets.AUTH_BOT_SECRET_KEY }}
      - uses: AtomiCloud/actions.cache-npm@v1
        with:
          namespacelabs: 'false'

      # action
      - name: Release
        env:
          # needed for releaser
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop .#releaser -c scripts/ci/release.sh
